[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "retail_demand_forecasting"
version = "0.1.0"
description = "M5 PySpark Demand Forecasting with Kedro, PySpark, and MLflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kedro>=1.3.1",
    "kedro-datasets[spark]>=9.1",
    "kedro-mlflow>=2.0",
    "pyspark>=3.5",
    "mlflow>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "kaggle>=1.5",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "retail_demand_forecasting"
project_name = "retail_demand_forecasting"
kedro_init_version = "1.3.1"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "b17d142876e540e5a4919d3558a3a458"
