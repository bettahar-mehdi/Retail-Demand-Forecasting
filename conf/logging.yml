version: 1
disable_existing_loggers: false

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: simple
    filename: info.log
    maxBytes: 10485760
    backupCount: 20

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

root:
  level: INFO
  handlers: [console, file]
