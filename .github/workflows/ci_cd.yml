name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format --check
        run: ruff format --check src/ tests/

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install system deps for PySpark
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run pytest with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  dvc-validate:
    name: Pipeline Validation (dvc repro --dry)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install DVC
        run: pip install dvc==3.62.0
      - name: Validate DVC graph
        run: |
          dvc status || true
          dvc repro --dry || dvc dag || echo "DVC graph check done"
      - name: Check DVC files present
        run: |
          test -f dvc.yaml || (echo "dvc.yaml missing" && exit 1)
          test -f dvc.lock || (echo "dvc.lock missing" && exit 1)
          echo "DVC graph valid"

  docker:
    name: Container Verification
    runs-on: ubuntu-latest
    needs: dvc-validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: retail-demand-forecasting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image runs
        run: |
          docker run --rm retail-demand-forecasting:ci python -c "import retail_demand_forecasting; print('image ok')"
